<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Cyclone Gamepad Interface</title>
  <style>
    body { font-family: monospace; padding: 20px; }
    pre { background: #f4f4f4; padding: 10px; border-radius: 5px; }
    #cam {
      display: block;
      margin: 20px auto;
      max-width: 1000px;   /* smaller max size; adjust as needed */
      width: 100%;        /* responsive */
      height: auto;       /* keep aspect ratio */
    }
  </style>
</head>
<body onload="setInterval(publishHeartbeat, 500)">
  <h1>Cyclone Gamepad Interface</h1>
  <pre id="output">Connect your controller…</pre>

  <!-- roslibjs (correct path) -->
  <script src="https://cdn.jsdelivr.net/npm/roslib/build/roslib.min.js"></script>
  <script>
    // Guard: ensure ROSLIB loaded correctly
    if (!window.ROSLIB || typeof ROSLIB.Message === 'undefined') {
      console.error('ROSLIB failed to load or Message is unavailable. Check the script src URL and network.');
    }
  </script>

  <!-- ROS connection -->
  <script>
    const rosNode = new ROSLIB.Ros({
      url: 'ws://localhost:9090' // Adjust to your ROS bridge server
    });

    rosNode.on('connection', () => {
      console.log('Connected to ROS bridge server.');
    });

    rosNode.on('error', (error) => {
      console.error('Error connecting to ROS bridge server:', error);
    });

    rosNode.on('close', () => {
      console.log('Connection to ROS bridge server closed.');
    });

    // Publisher for controller data
    const controllerPub = new ROSLIB.Topic({
      ros: rosNode,
      name: '/ps5_controller',
      // ROS 2 message type notation includes '/msg/'
      messageType: 'custom_interfaces/msg/Gamepad'
    });
    
    const heartbeatPub = new ROSLIB.Topic({
      ros: rosNode,
      name: '/joystick_heartbeat',
      messageType: 'std_msgs/msg/Empty'
    })

    controllerPub.advertise();
    heartbeatPub.advertise();

    function publishControllerData(x = 0.0, y = 0.0, rise = 0.0, sink = 0.0, yaw = 0.0, pitch = 0.0,
                                   cross_button=false, square_button=false, triangle_button=false, circle_button=false,
                                   dpad_down=false, dpad_left=false, dpad_up=false, dpad_right=false,
                                   bumper_left=false, bumper_right=false, start=false, select=false,
                                   joystick_press_left=false, joystick_press_right=false) {
      const msg = new ROSLIB.Message({
        x: x,
        y: y,
        rise: rise,
        sink: sink,
        yaw: yaw,
        pitch: pitch,
        cross_button: cross_button,
        square_button: square_button,
        triangle_button: triangle_button,
        circle_button: circle_button,
        dpad_down: dpad_down,
        dpad_left: dpad_left,
        dpad_up: dpad_up,
        dpad_right: dpad_right,
        bumper_left: bumper_left,
        bumper_right: bumper_right,
        start: start,
        select: select,
        joystick_press_left: joystick_press_left,
        joystick_press_right: joystick_press_right

      });
      controllerPub.publish(msg);
    }

    function publishHeartbeat() {
      if (navigator.getGamepads()[0]) { // only publish if controller is connected
        const msg = new ROSLIB.Message({});
        heartbeatPub.publish(msg);
      }
    }

  </script>

  <script>
    const output = document.getElementById('output');
    let animationFrameId;

    function updateGamepad() {
      const gp = navigator.getGamepads()[0]; // first controller
      if (!gp) {
        output.textContent = "❌ No controller detected";
        requestAnimationFrame(updateGamepad);
        return;
      }

      // Axes (sticks)
      const leftStickX = gp.axes[0];
      const leftStickY = gp.axes[1]*-1; //ps5 controller inverts
      const rightStickX = gp.axes[2];
      const rightStickY = gp.axes[3]*-1; //ps5 controller inverts

      // Buttons (PS5: 0=cross, 1=circle, 2=square, 3=triangle)
      // Arrows (PS5: 12=up, 13=down, 14=left, 15=right)
      // Bumpers (PS5: left=4, right=5)
      // Select (PS5: 8)
      // Start (PS5: 9)
      // Joystick press (PS5: left=10, right=11)
      const buttons = gp.buttons.map((b, i) => b.pressed ? i : "").filter(b => b !== "").join(", ");

      // Triggers (L2=6, R2=7)
      const l2 = gp.buttons[6].value; // analog
      const r2 = gp.buttons[7].value; // analog

      output.textContent =
        `Controller: ${gp.id}\n` +
        `Left Stick:  [${leftStickX.toFixed(2)}, ${leftStickY.toFixed(2)}]\n` +
        `Right Stick: [${rightStickX.toFixed(2)}, ${rightStickY.toFixed(2)}]\n` +
        `Buttons pressed: ${buttons || "none"}\n` +
        `L2: ${l2.toFixed(2)}, R2: ${r2.toFixed(2)}`;

      animationFrameId = requestAnimationFrame(updateGamepad);

      // Example: Publish left stick X axis value to ROS
      publishControllerData(
        x = Math.abs(leftStickX) > 0.1 ? leftStickX : 0.0,
        y = Math.abs(leftStickY) > 0.1 ? leftStickY : 0.0,
        rise = r2,
        sink = l2,
        yaw = Math.abs(rightStickX) > 0.1 ? rightStickX : 0.0,
        pitch = Math.abs(rightStickY) > 0.1 ? rightStickY : 0.0,
        cross_button = gp.buttons[0].pressed,
        square_button = gp.buttons[2].pressed,
        triangle_button = gp.buttons[3].pressed,
        circle_button = gp.buttons[1].pressed,
        dpad_down = gp.buttons[13].pressed,
        dpad_left = gp.buttons[14].pressed,
        dpad_up = gp.buttons[12].pressed,
        dpad_right = gp.buttons[15].pressed,
        bumper_left = gp.buttons[4].pressed,
        bumper_right = gp.buttons[5].pressed,
        start = gp.buttons[9].pressed,
        select = gp.buttons[8].pressed,
        joystick_press_left = gp.buttons[10].pressed,
        joystick_press_right = gp.buttons[11].pressed
      );
    }

    // When controller is connected
    window.addEventListener("gamepadconnected", (e) => {
      console.log(`Controller connected: ${e.gamepad.id}`); // Log to console
      updateGamepad();
    });

    // When controller is disconnected
    window.addEventListener("gamepaddisconnected", () => {
      output.textContent = "⚠️ Controller disconnected";
      console.log("Controller disconnected"); // Log to console
      cancelAnimationFrame(animationFrameId); // Pause updateGamepad loop
    });
    windows.addEventListener("beforeunload", () => {
        controllerPub.unadvertise();
    });
  </script>
</body>
</html>
